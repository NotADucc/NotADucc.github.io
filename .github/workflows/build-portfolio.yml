name: build

on:
  push:
    branches: ["minified"]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Private encryption workflow run containing the portfolio artifact"
        required: false
        type: string

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  request-encryption:
    if: ${{ github.event_name == 'push' || !inputs.artifact_run_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch private encryption workflow
        env:
          GH_TOKEN: ${{ secrets.ENCRYPTION_REPO_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/NotADucc/NotADucc.github.io-encryption/actions/workflows/encrypt-portfolio.yml/dispatches" \
            --data '{"ref":"main"}'

  build-static-site:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.artifact_run_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download encrypted portfolio artifact
        uses: actions/download-artifact@v5
        with:
          name: portfolio-encrypted
          repository: NotADucc/NotADucc.github.io-encryption
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.ENCRYPTION_REPO_TOKEN }}
          path: ${{ runner.temp }}/portfolio-artifact

      - name: Add encrypted portfolio data to source
        run: |
          mkdir -p ./src/public/assets/static/data
          cp "$RUNNER_TEMP/portfolio-artifact/portfolio.enc.json" \
            ./src/public/assets/static/data/portfolio.enc.json

      - name: Use Node.js (dependency)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build page index file
        run: node ./site_builder/updateProjects.js --mode prod

      - name: Install build dependencies
        run: npm install -g sass esbuild html-minifier-terser clean-css-cli

      - name: Prepare dist directory
        run: |
          rm -rf ./dist
          mkdir -p ./dist
          cp -a ./src/. ./dist/

      - name: Rename .css to .scss, compile, and restore
        run: |
          find ./dist -type f -name "*.css" | while read file; do
            tmp="${file%.css}.scss"
            cp "$file" "$tmp"
            npx sass --no-source-map "$tmp" "$file"
            rm "$tmp"
          done

      - name: Prepare JS output directory
        run: mkdir -p ./dist/public/assets/static/js

      - name: Bundle and minify JS
        run: |
          esbuild \
            ./site_builder/entries/*.js \
            --bundle \
            --minify \
            --format=esm \
            --splitting \
            --outdir=./dist/public/assets/static/js/ \
            --entry-names=[name].min \
            --chunk-names=chunks/[name]-[hash]

      - name: Remove unbundled source JS
        run: |
          JS=./dist/public/assets/static/js

          find "$JS" -type f -name "*.js" \
            ! -name "*.min.js" \
            ! -path "$JS/chunks/*" \
            -delete

      - name: Minify CSS files
        run: find ./dist -type f -name "*.css" -exec cleancss -o {} {} \;

      - name: Minify HTML files
        run: |
          find ./dist -type f -name "*.html" -exec html-minifier-terser {} \
            --collapse-whitespace \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --minify-css true \
            --minify-js true \
            -o {} \;

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: "./dist/"
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build-static-site
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
