name: build

on:
  push:
    branches: [ "test" ]

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: check out the repository
        uses: actions/checkout@v4

      - name: Use Node.js (dependency)
        uses: actions/setup-node@v4
        with:
            node-version: 20

      - name: Build page index file
        run: node ./site_builder/updateProjects.js --mode prod

      - name: Install build dependencies
        run: npm install -g sass esbuild html-minifier-terser clean-css-cli

      - name: Prepare dist directory
        run: |
          rm -rf ./dist
          mkdir -p ./dist
          cp -a ./src/. ./dist/

      - name: Rename .css to .scss, compile, and restore
        run: |
          find ./dist -type f -name "*.css" | while read file; do
            tmp="${file%.css}.scss"
            cp "$file" "$tmp"
            npx sass --no-source-map "$tmp" "$file"
            rm "$tmp"
          done

      - name: Prepare JS output directory
        run: |
          JS=./dist/public/assets/static/js
          mkdir -p "$JS"

      - name: Bundle and minify JS
        run: |
          esbuild \
            ./site_builder/entries/*.js \
            --bundle \
            --minify \
            --format=esm \
            --splitting \
            --outdir=./dist/public/assets/static/js/ \
            --entry-names=[name].min \
            --chunk-names=chunks/[name]-[hash]

      - name: Remove unbundled source JS
        run: |
          JS=./dist/public/assets/static/js

          find "$JS" -type f -name "*.js" \
            ! -name "*.min.js" \
            ! -path "$JS/chunks/*" \
            -delete

      - name: Minify CSS files
        run: find ./dist -type f -name "*.css" -exec cleancss -o {} {} \;

      - name: Minify HTML files
        run: |
          find ./dist -type f -name "*.html" -exec html-minifier-terser {} \
            --collapse-whitespace \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            --minify-css true \
            --minify-js true \
            -o {} \;

      - name: Check for modified files
        id: git-check
        run: echo modified=$(if git diff-index --quiet HEAD --; then echo "false"; else echo "true"; fi) >> $GITHUB_OUTPUT

      - name: Push to branch
        if: steps.git-check.outputs.modified == 'true'
        run: |
            git config --global user.email "robertohelper@outlook.com"
            git config --global user.name "Gwilom-Bot"
            git add .
            git commit -am "refactor: Updated static project files (generated index and minified files)" || true
            git push || git pull --rebase && git push

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: '.'
