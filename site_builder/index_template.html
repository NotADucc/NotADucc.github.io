<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Portfolio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet" href="./public/assets/static/styling/main.css">
        <link rel="icon" type="image/x-icon" href="./public/assets/favicon.ico">   
    </head>
<body>
    <header>
        <div class="container">
            <a href="/">
                <img
                    src="./public/assets/img/logo/hehe-logo.png"
                    alt="Hehe cat"
                />
                <span class="link">
                    Hehe.
                </span>
            </a>
            <div id="dashboard" class="collapsed">
                <div class="dashboard_header">
                    <div class="dashboard_title">
                        <span>Particle Dashboard</span>
                    </div>
                    <div class="header_buttons">
                        <div id="header_actions_container" class="invisible">
                            <button id="reset_button" class="button">
                                <svg id="reset" viewBox="0 0 24 24">
                                    <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                                    <path d="M3 3v5h5" />
                                </svg>
                            </button>

                            <button id="randomize_button" class="button">
                                <svg id="randomize" viewBox="0 0 24 24">
                                    <path d="M16 3h5v5" />
                                    <path d="M4 20 21 3" />
                                    <path d="M21 16v5h-5" />
                                    <path d="m15 15 6 6" />
                                    <path d="m4 4 5 5" />
                                </svg>
                            </button>

                            <button id="minus_button" class="button">
                                <div id="minus"></div>
                            </button>
                            <button id="plus_button" class="button">
                                <div id="plus"></div>
                            </button>
                        </div>
                        
                        <button id="hide_matrix" class="button">
                            <svg id="visibility_on" viewBox="0 0 24 24">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>

                            <svg id="visibility_off" viewBox="0 0 24 24" class="hidden">
                                <path d="m3 3 18 18" />
                                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.5 14.5 0 0 1-3 3.8" />
                                <path d="M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8" />
                            </svg>
                        </button>

                        <button id="expand_button" class="button">
                            <div id="expand_button_triangle"></div>
                        </button>
                    </div>
                </div>
                <div id="dashboard_content" class="invisible"></div>
                <div id="mobile_message" class="invisible">
                    Particle dashboard is not available on mobile.
                </div>
            </div>
        </div>
        <canvas id="noise" width="1000" height="73"></canvas>
    </header>

    <main>
        <div>
            <h1>Welcome to my portfolio.</h1>
            <section>
                <div class="tile_container"></div>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <a 
                href=""
                class="link"
            > 
                Gwilom. 
            </a>
            <p class="copyright">
                © Copyright 2025. All Snides Reserved.
            </p>
            <div> 
                <a
                  href="https://github.com/NotADucc"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Github"
                >
                <i class="fa fa-github icon"></i>
                </a>
            </div>
        </div>
    </footer>
</body>
</html>
